const START=new Date('2026-08-10T00:00:00'), END=new Date('2027-07-31T23:59:59');
const MONTHS=[];
(function buildMonths(){
  let d=new Date(2026,7,1);
  const end=new Date(2027,6,1);
  while(d<=end){
    MONTHS.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
    d=new Date(d.getFullYear(),d.getMonth()+1,1);
  }
})();

function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function localISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function localDate(iso){let p=iso.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function monthName(m){let p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'})}
function monthShort(m){let p=m.split('-').map(Number);return new Date(p[0],p[1]-1,1).toLocaleString('en-IN',{month:'short'}).toUpperCase()}
function isSunday(iso){return localDate(iso).getDay()===0}
function datesInMonth(m){
  let p=m.split('-').map(Number),y=p[0],mo=p[1],last=new Date(y,mo,0),a=[];
  for(let day=1;day<=last.getDate();day++){
    let z=new Date(y,mo-1,day),iso=localISO(z);
    if(z>=START&&z<=END)a.push(iso);
  }
  return a;
}
function isWorkingDate(iso){return !isSunday(iso)&&!db.holidays[iso]}
function holidayCount(m){return datesInMonth(m).filter(x=>!!db.holidays[x]).length}
function working(m){return datesInMonth(m).filter(isWorkingDate).length}
function status(id,iso){return (db.attendance[id]||{})[iso]||''}function setStatus(id,iso,v){db.attendance[id]=db.attendance[id]||{};if(v)db.attendance[id][iso]=v;else delete db.attendance[id][iso];save()}
function presentMonth(id,m){return datesInMonth(m).filter(x=>status(id,x)==='P'&&!db.holidays[x]).length}
function absentMonth(id,m){return datesInMonth(m).filter(x=>status(id,x)==='A'&&!db.holidays[x]).length}
function cumulative(id,m){let w=0,p=0;for(const x of MONTHS){if(x>m)break;w+=working(x);p+=presentMonth(id,x)}return {w,p,pct:w?p/w*100:0}}
function filteredStudents(trade,q){q=(q||'').toLowerCase();return STUDENTS.filter(s=>(!trade||s.trade===trade)&&(!q||s.name.toLowerCase().includes(q)||s.enrolment.toLowerCase().includes(q)))}

function calendarHtml(m,selected){
  let p=m.split('-').map(Number),first=new Date(p[0],p[1]-1,1);
  let out='<div class="calendar">';
  ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(x=>out+=`<div class="dow">${x}</div>`);
  for(let i=0;i<first.getDay();i++)out+='<div class="day empty"></div>';
  for(const iso of datesInMonth(m)){
    const dd=localDate(iso);
    const holiday=!!db.holidays[iso], sunday=dd.getDay()===0;
    const isSelected=iso===selected;
    let cl=isSelected?' selected':'';
    if(holiday)cl+=' holiday'; else if(sunday)cl+=' sun';
    const label=holiday?'HOLIDAY':sunday?'Sunday':'WORKING DAY';
    out+=`<div class="day${cl}" onclick="pickEntryDate('${iso}')">
      <div class="num">${dd.getDate()}</div>
      <div class="muted">${label}</div>
    </div>`;
  }
  const w=working(m),h=holidayCount(m),s=datesInMonth(m).filter(isSunday).length;
  out+=`</div><div class="calendar-summary"><b>Working days: ${w}</b> &nbsp; <b>Sundays: ${s}</b> &nbsp; <b>Holidays: ${h}</b></div>`;
  return out;
}

function markLow(ws,startRow,pctCol,endRow){for(let r=startRow;r<=endRow;r++){let cell=ws.getCell(r,pctCol);if(typeof cell.value==='number'&&cell.value<80){for(let c=1;c<=ws.columnCount;c++){ws.getCell(r,c).fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFFFC7CE'}};ws.getCell(r,c).font={color:{argb:'FF9C0006'},bold:true}}}}}
async function saveWorkbook(wb,name){let buf=await wb.xlsx.writeBuffer();let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a.download=name;a.click()}
async function exportFive(){let trade=document.getElementById('exTrade').value,m=document.getElementById('exMonth').value,rows=filteredStudents(trade,'');let out=rows.map((s,i)=>{let c=cumulative(s.enrolment,m);return[i+1,s.name,c.w,c.p,c.pct]});let wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Attendance');setupSheet(ws,['Sr No','Student Name','Total Working Day','Present Day','Percentage'],out,monthName(m)+' Attendance Summary',`Trade: ${trade||'All Trades'} | Month: ${monthName(m)}`);for(let r=6;r<6+out.length;r++){ws.getCell(r,5).numFmt='0.00%';ws.getCell(r,5).value=(out[r-6][4]/100)}markLow(ws,6,5,5+out.length-1);await saveWorkbook(wb,`ITI_Attendance_${monthShort(m)}_${trade||'All_Trades'}.xlsx`)}
async function exportSix(){let trade=document.getElementById('exTrade2').value,ms=MONTHS.slice(0,6),headers=['Sr No','Student Name',...ms.map(m=>monthShort(m)+' Present Day'),'Total Working Day','Total Present Day','Percentage'];let rows=filteredStudents(trade,'').map((s,i)=>{let c=cumulative(s.enrolment,ms[5]);return[i+1,s.name,...ms.map(m=>presentMonth(s.enrolment,m)),c.w,c.p,c.pct/100]});let wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('6 Month Summary');setupSheet(ws,headers,rows,'Attendance Six-Month Summary','August 2026 to January 2027 | Trade: '+(trade||'All Trades'));for(let r=6;r<6+rows.length;r++)ws.getCell(r,headers.length).numFmt='0.00%';markLow(ws,6,headers.length,5+rows.length-1);await saveWorkbook(wb,`ITI_Attendance_Aug-Jan_${trade||'All_Trades'}.xlsx`)}
async function exportDateWise(){let trade=document.getElementById('exTrade').value,m=document.getElementById('exMonth').value,rows=filteredStudents(trade,'');let data=[];datesInMonth(m).forEach(iso=>rows.forEach((s,i)=>data.push([iso,s.trade,i+1,s.name,status(s.enrolment,iso)||'P'])));let wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('Date-wise Entry');setupSheet(ws,['Date','Trade','Sr No','Student Name','Attendance'],data,'Date-wise Attendance Entry',`Month: ${monthName(m)} | Trade: ${trade||'All Trades'}`);await saveWorkbook(wb,`ITI_Datewise_${monthShort(m)}_${trade||'All_Trades'}.xlsx`)}
renderEntry();showPage('entry');
